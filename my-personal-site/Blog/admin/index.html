<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت وبلاگ</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-section" class="login-wrapper">
        <div class="login-box">
            <h2><i class="fas fa-user-lock"></i> ورود مدیر</h2>
            <input type="text" id="username" placeholder="نام کاربری">
            <input type="password" id="password" placeholder="رمز عبور">
            <button onclick="login()" class="btn-submit">ورود به سیستم</button>
            <p id="login-msg" class="error-msg"></p>
        </div>
    </div>

    <div id="dashboard-section" style="display: none;">
        <header class="admin-header">
            <h3>پنل مدیریت</h3>
            <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </header>

        <div class="container">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3><i class="fas fa-pen-nib"></i> مدیریت مطلب</h3>
                    <button onclick="clearForm()" class="btn-new" title="پاک کردن فرم برای نوشته جدید">
                        <i class="fas fa-plus"></i> نوشته جدید
                    </button>
                </div>

                <input type="hidden" id="post-id">

                <input type="text" id="post-title" placeholder="عنوان مقاله...">
                <textarea id="post-summary" rows="3" placeholder="خلاصه کوتاه..."></textarea>

                <div style="background: #fff; color: #000; border-radius: 8px; margin-bottom: 20px;">
                    <div id="editor-container" style="height: 300px;"></div>
                </div>

                <button onclick="submitPost()" class="btn-submit" id="submit-btn">انتشار مقاله</button>
            </div>

            <div class="card">
                <h3><i class="fas fa-list"></i> مطالب منتشر شده</h3>
                <ul id="admin-posts-list" class="posts-list"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="script.js"></script>
</body>
</html>
